<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>

    <!-- Crimson Glow -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A54" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF2A54" stop-opacity="0"/>
    </radialGradient>

    <!-- Cobalt Glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Rounded Squircle Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2"/>

  <!-- Iconic 'H' for HERETIQ -->
  <text 
    x="32" 
    y="32" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="900" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-0.5"
  >H</text>

  <!-- Crimson Dot Glow & Core -->
  <circle cx="23" cy="49" r="7" fill="url(#redGlow)" />
  <circle cx="23" cy="49" r="3.5" fill="#FF2A54" />

  <!-- Cobalt Dot Glow & Core -->
  <circle cx="41" cy="49" r="7" fill="url(#blueGlow)" />
  <circle cx="41" cy="49" r="3.5" fill="#0066FF" />
</svg>
